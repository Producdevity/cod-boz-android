name: android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check and build
        run: >-
          ./gradlew spotlessCheck :app:test :app:lintDebug
          :app:assembleDebug :app:assembleRelease
          :app:assembleInstrumentationAndroidTest --stacktrace

      - name: Verify packages
        run: |
          scripts/verify-no-game-data.sh
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          release_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          scripts/verify-apk.sh "$debug_apk"
          scripts/verify-apk.sh --unsigned "$release_apk"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: cod-boz-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CODBOZ_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codboz-release.jks"

      - name: Build signed release
        env:
          CODBOZ_RELEASE_KEYSTORE: ${{ runner.temp }}/codboz-release.jks
          CODBOZ_RELEASE_STORE_PASSWORD: ${{ secrets.CODBOZ_RELEASE_STORE_PASSWORD }}
          CODBOZ_RELEASE_KEY_ALIAS: ${{ secrets.CODBOZ_RELEASE_KEY_ALIAS }}
          CODBOZ_RELEASE_KEY_PASSWORD: ${{ secrets.CODBOZ_RELEASE_KEY_PASSWORD }}
        run: ./gradlew spotlessCheck :app:test :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify release APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          scripts/verify-no-game-data.sh
          scripts/verify-apk.sh "$apk"

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: cod-boz-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 30
